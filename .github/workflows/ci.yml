name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint HOIT Core changes
        run: >-
          npx eslint
          db/schema.ts
          db/seed.ts
          db/hoit-metrics.ts
          db/pm5560.ts
          db/operational-condition-engine.ts
          db/electrical-alarm-engine.ts
          db/electrical.ts
          db/cold-chain.ts
          db/cold-chain-history.ts
          db/cold-chain-alarm-engine.ts
          db/report-engine.ts
          db/report-export.ts
          app/api/v1/gateway/ingest/route.ts
          app/api/v1/gateway/_lib/ingest-v2.ts
          app/api/v1/telemetry/metrics
          app/api/v1/cold-chain
          app/api/v1/electrical
          app/cold-chain-view.tsx
          app/cold-chain-detail.tsx
          app/electrical-view.tsx
          app/electrical-history.tsx
          app/reports-view.tsx
          tests/gateway-ingest-v2.test.ts
          tests/pm5560-e2e.test.ts
          tests/cold-chain-e2e.test.ts
          tests/cold-chain.test.ts
          tests/cold-chain-history.test.ts
          tests/report-export.test.ts
          tests/database-schema.test.mjs
          tests/database-seed.test.ts

      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build
