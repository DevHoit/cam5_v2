name: Mantener operación HoitLive Core

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoitlive-core-operations
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HOIT_CORE_URL: https://core.hoitlive.com
    steps:
      - name: Ejecutar ciclo operacional
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 90 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$HOIT_CORE_URL/api/v1/system/operations"
      - name: Actualizar agregados históricos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$HOIT_CORE_URL/api/v1/trends/aggregate"
      - name: Generar reportes programados
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$HOIT_CORE_URL/api/v1/reports/process"
