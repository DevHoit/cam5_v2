name: Mantener telemetría CAM5

# Las tareas programadas corren como cron nativo de Vercel (vercel.json).
# Este workflow queda solo como respaldo manual: Actions → "Mantener telemetría CAM5" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cam5-alarm-evaluator
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Configurar en Settings → Secrets and variables → Actions → Variables (p. ej. https://core.hoitlive.com).
      CAM5_BASE_URL: ${{ vars.CAM5_BASE_URL || 'https://cam5v2.vercel.app' }}
    steps:
      - name: Evaluar pérdida de comunicación
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${CAM5_BASE_URL%/}/api/v1/alarms/evaluate"
      - name: Actualizar agregados históricos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${CAM5_BASE_URL%/}/api/v1/trends/aggregate"
      - name: Procesar cola de notificaciones
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${CAM5_BASE_URL%/}/api/v1/notifications/process"
      - name: Generar reportes programados
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${CAM5_BASE_URL%/}/api/v1/reports/process"
