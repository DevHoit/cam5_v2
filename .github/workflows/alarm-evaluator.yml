name: Mantener operación HoitLive Core

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoitlive-core-operations
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      HOIT_CORE_URL: https://core.hoitlive.com
    timeout-minutes: 2
    steps:
      - name: Evaluar pérdida de comunicación
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            $HOIT_CORE_URL/api/v1/alarms/evaluate
      - name: Actualizar agregados históricos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            $HOIT_CORE_URL/api/v1/trends/aggregate
      - name: Procesar cola de notificaciones
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            $HOIT_CORE_URL/api/v1/notifications/process
      - name: Generar reportes programados
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            $HOIT_CORE_URL/api/v1/reports/process
